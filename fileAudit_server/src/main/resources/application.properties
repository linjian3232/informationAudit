spring.application.name=information-audit
server.address=${AUDIT_BIND_ADDRESS:127.0.0.1}
server.port=${AUDIT_PORT:8888}

spring.datasource.url=${AUDIT_DB_URL:jdbc:mysql://127.0.0.1:3306/information_audit?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${AUDIT_DB_USER:audit}
spring.datasource.password=${AUDIT_DB_PASSWORD:}
spring.datasource.initialization-mode=never

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.resources.static-locations=classpath:/static/,file:${AUDIT_FRONTEND_DIR:../fileAudit-manage/dist}/

mybatis.mapper-locations=classpath:mapper/*.xml
audit.storage-root=${AUDIT_STORAGE_ROOT:.}
